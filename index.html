<!DOCTYPE html>

                    href="https://hackclub.enterprise.slack.com/team/U0A2SJ7B739">Gabin</a> & <a

                Sponsored by <a href="https://hackclub.enterprise.slack.com/team/U08RVF1BAN4">barnav</a> & <a
                    href="https://hackclub.enterprise.slack.com/team/U087BHR98AX">seba</a>
